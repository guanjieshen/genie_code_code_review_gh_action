[project]
name = "lakehouse-review"
version = "0.4.1"
license = { file = "LICENSE" }
description = "Lakehouse Review: Databricks-aware code reviews with Genie-powered semantic analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.60",
    "sqlglot>=26",
    "pyyaml>=6",
    "jsonschema>=4.21",
    "requests>=2.31",
]

[project.scripts]
lakehouse-review = "genie_review.cli:main"
genie-review = "genie_review.cli:main"   # deprecated alias

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genie_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
