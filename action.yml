name: Lakehouse Review
description: Databricks-aware code reviews with Genie-powered semantic analysis.
author: Guanjie Shen
branding:
  icon: database
  color: orange

inputs:
  databricks-host:
    description: Workspace URL the code deploys to (for example https://adb-123.11.azuredatabricks.net).
    required: true
  client-id:
    description: Application ID of the read-only reviewer service principal.
    required: true
  client-secret:
    description: OAuth secret of the reviewer service principal. Leave empty to use GitHub OIDC federation.
    required: false
    default: ""
  bundle-target:
    description: Bundle target to review against. Defaults to the bundle's default target.
    required: false
    default: ""
  bundle-dir:
    description: Folder that contains databricks.yml, relative to the repo root. Use this in monorepos.
    required: false
    default: "."
  warehouse-id:
    description: SQL warehouse for metadata queries. Defaults to the first serverless warehouse the reviewer can use.
    required: false
    default: ""
  analysis-depth:
    description: "`rapid` (default): exact checks plus one compact Genie Code review. `detailed`: full evidence and ontology questions to Genie One (more time and tokens)."
    required: false
    default: ""
  semantic:
    description: Semantic checks backend. `genie-one` or `off`.
    required: false
    default: ""
  fail-on:
    description: Fail the check on any merge blocker (`blocker`), or at a severity or above (`critical`, `high`, `medium`). Default `none` only comments.
    required: false
    default: ""
  fail-on-error:
    description: Fail the check when the review cannot run (for example sign-in or bundle errors). By default it posts how to fix the problem and passes.
    required: false
    default: "false"
  genie-model:
    description: Override the Genie Code model. Leave empty for Genie Code's default.
    required: false
    default: ""
  genie-host:
    description: Separate workspace that serves the Genie Code model, when the target workspace does not. Data and evidence stay on databricks-host.
    required: false
    default: ""
  genie-client-id:
    description: Service principal for genie-host. Defaults to client-id.
    required: false
    default: ""
  genie-client-secret:
    description: OAuth secret for genie-host. Defaults to client-secret.
    required: false
    default: ""
  on-model-unavailable:
    description: What to do if no Genie Code model is reachable. `deterministic` (post exact checks only), `skip`, or `fail`.
    required: false
    default: ""
  config-file:
    description: Path to the repo config file (read from the base branch). Defaults to .lakehouse-review/config.yml in bundle-dir (.genie-review/ is still read).
    required: false
    default: ""
  instructions:
    description: Extra team context for the reviewer, appended to the base-branch instructions file.
    required: false
    default: ""
  python-index-url:
    description: Python package index to install dependencies from, for runners that cannot reach pypi.org (for example an Artifactory or Nexus mirror). Packages are hash-pinned, so a mirror cannot substitute them.
    required: false
    default: ""
  ca-bundle:
    description: Path to a PEM file with extra trusted certificates, for networks that inspect TLS. Relative paths are resolved from the repo root. Applied to every tool the action runs.
    required: false
    default: ""
  genie-version:
    description: Genie Code CLI release to install.
    required: false
    default: v0.2.0
  upload-artifacts:
    description: Upload review.json, the impact graph, evidence, and prompt as a workflow artifact for debugging. They contain table and column metadata, so keep this off in public repositories.
    required: false
    default: "false"
  github-token:
    description: Token used to post the review comment.
    required: false
    default: ${{ github.token }}

outputs:
  status:
    description: "Review result: blocker, action_required, review_recommended, informational, no_issues, no_issues_partial, or not_run (setup problem)."
    value: ${{ steps.review.outputs.status }}
  issues:
    description: Number of issues shown in the review (related findings are grouped into one issue).
    value: ${{ steps.review.outputs.issues }}
  blockers:
    description: Number of issues rated as blocking the merge.
    value: ${{ steps.review.outputs.blockers }}
  review-json:
    description: Path to review.json on the runner (the full structured review).
    value: ${{ steps.review.outputs.review_json }}
  findings:
    description: Number of findings posted.
    value: ${{ steps.review.outputs.findings }}
  critical:
    description: Number of critical findings.
    value: ${{ steps.review.outputs.critical }}
  comment-url:
    description: URL of the review comment.
    value: ${{ steps.review.outputs.comment_url }}

runs:
  using: composite
  steps:
    - name: "Initialize: check event"
      id: guard
      shell: bash
      env:
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        THIS_REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
      run: |
        if [[ "$EVENT" != "pull_request" ]]; then
          echo "::notice::Lakehouse Review runs on pull_request events only. Skipping."
          echo "run=false" >> "$GITHUB_OUTPUT"
        elif [[ "$HEAD_REPO" != "$THIS_REPO" ]]; then
          echo "::notice::Pull requests from forks do not receive secrets. Skipping Lakehouse Review."
          echo "run=false" >> "$GITHUB_OUTPUT"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi

    - name: "Initialize: validate inputs"
      if: steps.guard.outputs.run == 'true'
      shell: bash
      env:
        HOST: ${{ inputs.databricks-host }}
        CLIENT_ID: ${{ inputs.client-id }}
        GENIE_HOST: ${{ inputs.genie-host }}
        BUNDLE_DIR: ${{ inputs.bundle-dir }}
        DEPTH: ${{ inputs.analysis-depth }}
        SEMANTIC: ${{ inputs.semantic }}
        FAIL_ON: ${{ inputs.fail-on }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        ON_MODEL_UNAVAILABLE: ${{ inputs.on-model-unavailable }}
        UPLOAD: ${{ inputs.upload-artifacts }}
        PY_INDEX: ${{ inputs.python-index-url }}
        GENIE_VERSION: ${{ inputs.genie-version }}
        CA_BUNDLE: ${{ inputs.ca-bundle }}
      run: |
        set -o pipefail
        errors=()
        bad() { errors+=("$1"); echo "::error title=Lakehouse Review::$1"; }
        one_of() { local name="$1" value="$2"; shift 2
          [[ -z "$value" ]] && return 0
          for ok in "$@"; do [[ "$value" == "$ok" ]] && return 0; done
          bad "\`$name\` must be one of: $*. Got \`$value\`."; }
        https() { [[ -z "$2" || "$2" =~ ^https://[^/[:space:]]+(/[^[:space:]]*)?$ ]] || bad "\`$1\` must be an https:// URL. Got \`$2\`."; }

        [[ -n "$HOST" ]] || bad "\`databricks-host\` is required."
        https databricks-host "$HOST"
        https genie-host "$GENIE_HOST"
        https python-index-url "$PY_INDEX"
        [[ -n "$CLIENT_ID" ]] || bad "\`client-id\` is required (the reviewer service principal's application ID)."
        one_of analysis-depth "$DEPTH" rapid detailed
        one_of fail-on "$FAIL_ON" none blocker critical high medium
        one_of fail-on-error "$FAIL_ON_ERROR" true false
        one_of on-model-unavailable "$ON_MODEL_UNAVAILABLE" deterministic skip fail
        one_of upload-artifacts "$UPLOAD" true false
        [[ -z "$SEMANTIC" || "$SEMANTIC" == genie-one || "$SEMANTIC" == off ]] || bad "\`semantic\` must be \`genie-one\` or \`off\`. Got \`$SEMANTIC\`."
        [[ "$GENIE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || bad "\`genie-version\` must be a release tag such as \`v0.2.0\`. Got \`$GENIE_VERSION\`."
        if [[ "$BUNDLE_DIR" == /* || "/$BUNDLE_DIR/" == */../* ]]; then
          bad "\`bundle-dir\` must be a folder inside the repository, relative to its root. Got \`$BUNDLE_DIR\`."
        elif [[ ! -f "$GITHUB_WORKSPACE/${BUNDLE_DIR:-.}/databricks.yml" && ! -f "$GITHUB_WORKSPACE/${BUNDLE_DIR:-.}/databricks.yaml" ]]; then
          bad "No databricks.yml in \`${BUNDLE_DIR:-.}\`. Check out the repository first (actions/checkout with fetch-depth: 0) and set \`bundle-dir\` to the bundle folder."
        fi
        if [[ -n "$CA_BUNDLE" ]]; then
          ca="$CA_BUNDLE"; [[ "$ca" == /* ]] || ca="$GITHUB_WORKSPACE/$ca"
          if [[ -r "$ca" ]] && grep -q "BEGIN CERTIFICATE" "$ca"; then
            for v in SSL_CERT_FILE REQUESTS_CA_BUNDLE CURL_CA_BUNDLE GENIE_CA_CERTIFICATE NODE_EXTRA_CA_CERTS; do echo "$v=$ca" >> "$GITHUB_ENV"; done
          else
            bad "\`ca-bundle\` must point to a readable PEM file with at least one certificate. Got \`$CA_BUNDLE\`."
          fi
        fi

        if (( ${#errors[@]} )); then
          { echo "**Some action inputs are not valid.**"; echo; printf -- '- %s\n' "${errors[@]}"; echo
            echo "Fix them in the workflow file that calls the action, then push again."; } > "$RUNNER_TEMP/lakehouse-review-setup-error.md"
          exit 1
        fi

    - name: "Initialize: set up uv"
      if: steps.guard.outputs.run == 'true'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: "Initialize: set up Databricks CLI"
      if: steps.guard.outputs.run == 'true'
      uses: databricks/setup-cli@9b64c94a6d2b2e830592d80e9f14c26d32b42ad7 # v1.20.0

    - name: "Initialize: install Genie Code CLI"
      if: steps.guard.outputs.run == 'true'
      shell: bash
      env:
        GENIE_VERSION: ${{ inputs.genie-version }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=x86_64 ;;
          aarch64|arm64) arch=aarch64 ;;
          *) echo "::error::Unsupported runner architecture $(uname -m)"; exit 1 ;;
        esac
        case "$(uname -s)" in
          Linux) target="${arch}-unknown-linux-musl" ;;
          Darwin) target="${arch}-apple-darwin" ;;
          *) echo "::error::Unsupported runner OS $(uname -s)"; exit 1 ;;
        esac
        pkg="genie-package-${target}.tar.gz"
        base="https://github.com/databricks/genie-code-cli/releases/download/${GENIE_VERSION}"
        dir="${RUNNER_TEMP}/genie-cli"
        mkdir -p "$dir" && cd "$dir"
        curl -fsSL -o "$pkg" "$base/$pkg"
        curl -fsSL -o "$pkg.sha256" "$base/$pkg.sha256"
        expected="$(awk '{print $1}' "$pkg.sha256")"
        actual="$( (sha256sum "$pkg" 2>/dev/null || shasum -a 256 "$pkg") | awk '{print $1}')"
        if [[ "$expected" != "$actual" ]]; then echo "::error::Checksum mismatch for $pkg"; exit 1; fi
        tar xzf "$pkg"
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "GENIE_BIN=$dir/bin/genie" >> "$GITHUB_ENV"

    - name: "Initialize: configure Databricks auth"
      if: steps.guard.outputs.run == 'true'
      shell: bash
      env:
        HOST: ${{ inputs.databricks-host }}
        CLIENT_ID: ${{ inputs.client-id }}
        CLIENT_SECRET: ${{ inputs.client-secret }}
        GENIE_HOST: ${{ inputs.genie-host }}
        GENIE_CLIENT_ID: ${{ inputs.genie-client-id }}
        GENIE_CLIENT_SECRET: ${{ inputs.genie-client-secret }}
      run: |
        set -euo pipefail
        cfg="${RUNNER_TEMP}/databrickscfg"
        profile() {
          local name="$1" host="$2" id="$3" secret="$4"
          echo "[$name]"
          echo "host = $host"
          echo "client_id = $id"
          if [[ -n "$secret" ]]; then
            echo "client_secret = $secret"
            echo "auth_type = oauth-m2m"
          else
            echo "auth_type = github-oidc"
          fi
          echo
        }
        {
          profile lakehouse-review "$HOST" "$CLIENT_ID" "$CLIENT_SECRET"
          if [[ -n "$GENIE_HOST" ]]; then
            profile lakehouse-review-model "$GENIE_HOST" "${GENIE_CLIENT_ID:-$CLIENT_ID}" "${GENIE_CLIENT_SECRET:-$CLIENT_SECRET}"
          fi
        } > "$cfg"
        chmod 600 "$cfg"
        echo "DATABRICKS_CONFIG_FILE=$cfg" >> "$GITHUB_ENV"
        # $GITHUB_ENV applies to later steps only, so export it for the check below too.
        export DATABRICKS_CONFIG_FILE="$cfg"
        # Do not fail here: the review step posts a comment that explains how to fix sign-in.
        databricks current-user me -p lakehouse-review > /dev/null 2>&1 || echo "::warning title=Lakehouse Review::Could not sign in to $HOST with the reviewer identity."

    - name: "Initialize: install dependencies"
      if: steps.guard.outputs.run == 'true'
      shell: bash
      env:
        PY_INDEX: ${{ inputs.python-index-url }}
      run: |
        set -euo pipefail
        venv="${RUNNER_TEMP}/lakehouse-review-venv"
        uv venv --quiet --python ">=3.11" "$venv"
        index=()
        [[ -n "$PY_INDEX" ]] && index=(--default-index "$PY_INDEX")
        uv pip install --quiet --python "$venv/bin/python" --require-hashes \
          -r "$GITHUB_ACTION_PATH/requirements.lock" "${index[@]}"
        echo "GENIE_REVIEW_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

    - name: "Initialize: fetch base branch"
      if: steps.guard.outputs.run == 'true'
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

    - name: "Analyze, process, and publish the review"
      id: review
      if: steps.guard.outputs.run == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BASE_REF: ${{ github.base_ref }}
        TARGET: ${{ inputs.bundle-target }}
        BUNDLE_DIR: ${{ inputs.bundle-dir }}
        WAREHOUSE: ${{ inputs.warehouse-id }}
        SEMANTIC: ${{ inputs.semantic }}
        DEPTH: ${{ inputs.analysis-depth }}
        FAIL_ON: ${{ inputs.fail-on }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        GENIE_MODEL: ${{ inputs.genie-model }}
        GENIE_HOST: ${{ inputs.genie-host }}
        ON_MODEL_UNAVAILABLE: ${{ inputs.on-model-unavailable }}
        CONFIG_FILE: ${{ inputs.config-file }}
        INSTRUCTIONS: ${{ inputs.instructions }}
      run: |
        set -euo pipefail
        args=(run --repo "$GITHUB_WORKSPACE" --base-ref "origin/$BASE_REF" --profile lakehouse-review
              --genie-bin "$GENIE_BIN" --bundle-dir "$BUNDLE_DIR" --out-dir "$RUNNER_TEMP/lakehouse-review")
        [[ -n "$CONFIG_FILE" ]] && args+=(--config-file "$CONFIG_FILE")
        [[ -n "$TARGET" ]] && args+=(--target "$TARGET")
        [[ -n "$WAREHOUSE" ]] && args+=(--warehouse-id "$WAREHOUSE")
        [[ -n "$SEMANTIC" ]] && args+=(--semantic "$SEMANTIC")
        [[ -n "$DEPTH" ]] && args+=(--depth "$DEPTH")
        [[ -n "$FAIL_ON" ]] && args+=(--fail-on "$FAIL_ON")
        [[ -n "$FAIL_ON_ERROR" ]] && args+=(--fail-on-error "$FAIL_ON_ERROR")
        [[ -n "$GENIE_MODEL" ]] && args+=(--genie-model "$GENIE_MODEL")
        [[ -n "$GENIE_HOST" ]] && args+=(--genie-profile lakehouse-review-model)
        [[ -n "$ON_MODEL_UNAVAILABLE" ]] && args+=(--on-model-unavailable "$ON_MODEL_UNAVAILABLE")
        [[ -n "$INSTRUCTIONS" ]] && args+=(--instructions "$INSTRUCTIONS")
        PYTHONPATH="$GITHUB_ACTION_PATH/src" "$GENIE_REVIEW_PYTHON" -m genie_review.cli "${args[@]}"

    - name: "Publish: explain setup failure on the pull request"
      # Runs only when setup failed before the review could start, so the PR still gets an explanation.
      if: failure() && steps.guard.outputs.run == 'true' && steps.review.outcome == 'skipped'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        marker='<!-- genie-data-review -->'
        detail="$RUNNER_TEMP/lakehouse-review-setup-error.md"
        if [[ -f "$detail" ]]; then
          body=$(printf '%s\n# Lakehouse Review\n\n**Review status:** Review could not run\n\n%s\n\nSee the [job log](%s) for details.' "$marker" "$(cat "$detail")" "$RUN_URL")
        else
          body=$(printf '%s\n# Lakehouse Review\n\n**Review status:** Review could not run\n\n⚠️ **The review could not start on this runner.**\n\nCommon causes:\n\n1. The runner cannot reach pypi.org. Set `python-index-url` to your package mirror.\n2. The runner cannot reach github.com to download the Genie Code CLI.\n3. The runner cannot reach the Databricks workspace. If a proxy is required, set `HTTPS_PROXY` on the job; if it inspects TLS, set `ca-bundle`.\n\nSee the [job log](%s) for the failing step.\n\n<sub>This does not block the pull request unless the check is required.</sub>' "$marker" "$RUN_URL")
        fi
        api="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/issues/${PR}/comments"
        auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json")
        existing=$(curl -fsSL "${auth[@]}" "${api}?per_page=100" | jq -r --arg m "$marker" '[.[] | select(.body | contains($m))][0].url // empty')
        payload=$(jq -n --arg b "$body" '{body: $b}')
        if [[ -n "$existing" ]]; then curl -fsSL -X PATCH "${auth[@]}" "$existing" -d "$payload" > /dev/null
        else curl -fsSL -X POST "${auth[@]}" "$api" -d "$payload" > /dev/null; fi

    - name: "Publish: upload review artifacts"
      if: always() && steps.guard.outputs.run == 'true' && inputs.upload-artifacts == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: lakehouse-review
        path: ${{ runner.temp }}/lakehouse-review
        if-no-files-found: ignore
