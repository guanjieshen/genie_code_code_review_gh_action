# Lakehouse Review ontology demo. Reads samples.tpch; the business rules are in pages/.
bundle:
  name: tpch_ontology_demo

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog for the demo output tables
    default: main
  schema:
    description: Schema for the demo output tables
    default: lakehouse_review_demo
  warehouse_id:
    description: SQL warehouse that runs the demo tasks. Replace with your warehouse ID.
    default: "<warehouse-id>"

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
