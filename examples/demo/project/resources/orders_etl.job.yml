resources:
  jobs:
    orders_etl:
      name: genie_review_demo_orders_etl
      tasks:
        - task_key: silver
          spark_python_task:
            python_file: ../src/silver_orders.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default
        - task_key: gold
          depends_on:
            - task_key: silver
          sql_task:
            file:
              path: ../src/gold_revenue.sql
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
