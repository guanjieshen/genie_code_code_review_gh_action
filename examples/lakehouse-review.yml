# Copy to .github/workflows/lakehouse-review.yml in your bundle repository.
name: Lakehouse Review

on:
  pull_request:
    paths: ["databricks.yml", "resources/**", "src/**", "**/*.sql", "**/*.py", "**/*.ipynb"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lakehouse-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: guanjieshen/genie_code_code_review_gh_action@v0
        with:
          databricks-host: ${{ vars.DATABRICKS_HOST }}
          client-id: ${{ vars.LAKEHOUSE_REVIEW_CLIENT_ID }}
          client-secret: ${{ secrets.LAKEHOUSE_REVIEW_CLIENT_SECRET }}
          bundle-target: staging
          # analysis-depth: detailed      # also ask Genie One about joins, grain, and codes
          # fail-on: blocker              # fail the check on blocking issues
          # genie-host: https://other-workspace.cloud.databricks.com   # if the target workspace has no Genie Code model
